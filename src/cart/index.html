<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cart</title>

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/cart.js" type="module"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="products">
        <h2>My Cart</h2>

        <p class="cart-empty" role="status" hidden>Your cart is empty. Browse products to add something for your next trip.</p>
        <ul class="product-list" aria-label="Items in your cart"></ul>
        <div class="cart-footer" hidden>
          <p class="cart-total">Cart total: <strong id="cart-total-value">$0.00</strong></p>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
