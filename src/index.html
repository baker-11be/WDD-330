<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js" type="module"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="./public/images/banner-sm.jpg"
          srcset="
            ./public/images/banner-sm.jpg 500w,
            ./public/images/banner.jpg
          "
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img
            src="./public/images/noun_Tent_2517.svg"
            alt="tent image for logo"
          />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="categories">
        <h2>Shop by Category</h2>
        <div class="category-list">
          <a
            class="category-card"
            href="product_listing/index.html?category=tents"
          >
            <svg aria-hidden="true" viewBox="0 0 64 64">
              <path
                d="M6 50 24 18l8 12 8-12 18 32"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
              />
              <path
                d="M24 18h16"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="3"
              />
            </svg>
            <h3>Tents</h3>
          </a>

          <a
            class="category-card"
            href="product_listing/index.html?category=backpacks"
          >
            <svg aria-hidden="true" viewBox="0 0 64 64">
              <path
                d="M22 22c0-6 4-10 10-10s10 4 10 10"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="3"
              />
              <rect
                x="16"
                y="18"
                width="32"
                height="34"
                rx="10"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              />
              <path
                d="M22 30h20M24 40h16"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="3"
              />
            </svg>
            <h3>Backpacks</h3>
          </a>

          <a
            class="category-card"
            href="product_listing/index.html?category=sleeping-bags"
          >
            <svg aria-hidden="true" viewBox="0 0 64 64">
              <path
                d="M22 14c-4 0-8 4-8 8v24c0 4 4 8 8 8h20c4 0 8-4 8-8V22c0-4-4-8-8-8Z"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              />
              <circle
                cx="25"
                cy="22"
                r="4"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              />
              <path
                d="M18 34c8 5 20 5 28 0"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="3"
              />
            </svg>
            <h3>Sleeping Bags</h3>
          </a>

          <a
            class="category-card"
            href="product_listing/index.html?category=hammocks"
          >
            <svg aria-hidden="true" viewBox="0 0 64 64">
              <path
                d="M10 20v12M54 20v12M10 20h8M46 20h8"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="3"
              />
              <path
                d="M10 32c7 10 14 14 22 14s15-4 22-14"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="3"
              />
              <path
                d="M10 32c8 4 16 6 22 6s14-2 22-6"
                fill="none"
                stroke="currentColor"
                stroke-dasharray="4 4"
                stroke-linecap="round"
                stroke-width="3"
              />
            </svg>
            <h3>Hammocks</h3>
          </a>
        </div>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
