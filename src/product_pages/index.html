<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Details</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="product-detail">
        <h3>Brand</h3>
        <h2 class="divider">Product Name</h2>
        <img class="divider" src="" alt="Product image" />
        <p class="product-card__price">$0.00</p>
        <p class="product__discount" hidden></p>
        <p class="product__color"></p>
        <p class="product__description"></p>
        <div class="product-detail__add">
          <button id="addToCart" data-id="">Add to Cart</button>
        </div>
      </section>
      <section class="product-comments" aria-labelledby="comments-heading">
        <h2 id="comments-heading">Product Comments</h2>
        <form id="comment-form" class="comment-form">
          <label for="comment-author">Your name (optional)</label>
          <input id="comment-author" name="author" maxlength="60" placeholder="Guest" autocomplete="name" />
          <label for="comment-text">Leave a comment</label>
          <textarea id="comment-text" name="comment" required maxlength="1000" placeholder="Write your thoughts..."></textarea>
          <button type="submit" id="submit-comment">Post Comment</button>
        </form>
        <p id="comments-empty" class="comments-empty" hidden>No comments yet. Be the first to add one!</p>
        <ul id="comments-list" class="comments-list" aria-live="polite"></ul>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
